name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinning an absolute Xcode path silently rots whenever the runner image
      # changes — that is what broke this workflow and got it disabled. Always
      # take the newest Xcode the image actually ships.
      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      # Likewise, don't hard-code a simulator name: resolve a concrete iPhone
      # UDID from whatever runtimes the image has.
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # GoogleService-Info.plist is gitignored, so CI checks out without it and
      # FirebaseApp.configure() aborts at launch — which crashed the test host
      # before it could bootstrap ("Early unexpected exit"). Unit tests never
      # contact Firebase, so a structurally valid placeholder is enough.
      - name: Provide placeholder Firebase config
        run: |
          PLIST=StreakSync/GoogleService-Info.plist
          if [ ! -f "$PLIST" ]; then
            cp StreakSync/GoogleService-Info.example.plist "$PLIST"
            PB=/usr/libexec/PlistBuddy
            "$PB" -c "Set :BUNDLE_ID com.mitsheth.StreakSync" "$PLIST"
            "$PB" -c "Set :GCM_SENDER_ID 000000000000" "$PLIST"
            echo "Wrote placeholder $PLIST"
          fi

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -i "iphone" | head -5

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StreakSync.xcodeproj \
            -scheme StreakSync

      - name: Build
        run: |
          set -o pipefail
          command -v xcpretty >/dev/null && FMT=xcpretty || FMT=cat
          xcodebuild build \
            -project StreakSync.xcodeproj \
            -scheme StreakSync \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | "$FMT"

      - name: Test
        run: |
          set -o pipefail
          command -v xcpretty >/dev/null && FMT=xcpretty || FMT=cat
          xcodebuild test \
            -project StreakSync.xcodeproj \
            -scheme StreakSync \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults \
            -only-testing:StreakSyncTests \
            CODE_SIGNING_ALLOWED=NO | "$FMT"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
