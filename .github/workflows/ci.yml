name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinning an absolute Xcode path silently rots whenever the runner image
      # changes — that is what broke this workflow and got it disabled. Always
      # take the newest Xcode the image actually ships.
      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      # Likewise, don't hard-code a simulator name: resolve a concrete iPhone
      # UDID from whatever runtimes the image has.
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot it up front and wait: launching into a still-booting device is a
          # common source of "Simulator device failed to launch" on CI runners.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      # GoogleService-Info.plist is gitignored, so CI checks out without it.
      # AppDelegate no longer aborts when it is absent, but the Firebase-backed
      # services built in AppContainer still call Firestore/Auth at launch, which
      # traps unless a FirebaseApp exists. Unit tests never reach the network, so
      # a structurally valid placeholder is enough to get the host running.
      - name: Provide placeholder Firebase config
        run: |
          PLIST=StreakSync/GoogleService-Info.plist
          if [ ! -f "$PLIST" ]; then
            cp StreakSync/GoogleService-Info.example.plist "$PLIST"
            PB=/usr/libexec/PlistBuddy
            # Firebase validates these: GOOGLE_APP_ID's middle segment must equal
            # GCM_SENDER_ID and its suffix must be hex, or +[FIRApp addAppToAppDictionary:]
            # raises and takes the process down. The example file's "exampleappid" fails
            # that check. These exact values were verified locally to boot the test host.
            "$PB" -c "Set :BUNDLE_ID com.mitsheth.StreakSync" "$PLIST"
            "$PB" -c "Set :GCM_SENDER_ID 000000000000" "$PLIST"
            "$PB" -c "Set :GOOGLE_APP_ID 1:000000000000:ios:abcdef0123456789" "$PLIST"
            "$PB" -c "Set :PROJECT_ID streaksync-ci" "$PLIST"
            "$PB" -c "Set :API_KEY AIzaSyCI0000000000000000000000000000000" "$PLIST"
            echo "Wrote placeholder $PLIST"
          fi

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -i "iphone" | head -5

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StreakSync.xcodeproj \
            -scheme StreakSync

      - name: Build
        run: |
          set -o pipefail
          command -v xcpretty >/dev/null && FMT=xcpretty || FMT=cat
          xcodebuild build \
            -project StreakSync.xcodeproj \
            -scheme StreakSync \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | "$FMT"

      # UI tests were excluded here on the belief that two unit tests ran ~6-7 min
      # each. Measured 2026-08-29, that was false: all 454 unit cases execute in
      # 0.47s combined and the whole unit target is ~56s wall clock. The UI target
      # is 264s serial for 10 tests (parallel is *slower* here at 615s - booting
      # clones dominates, which is also the documented source of "Failed to prepare
      # device 'Clone N'" flakiness, so -parallel-testing-enabled NO stays).
      # ~5.5 min of tests locally against a 45 min budget. The exclusion was also
      # hiding a real regression: two UI tests had been red since the Settings
      # subscreens became pushed details.
      - name: Test
        run: |
          set -o pipefail
          command -v xcpretty >/dev/null && FMT=xcpretty || FMT=cat
          xcodebuild test \
            -project StreakSync.xcodeproj \
            -scheme StreakSync \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults \
            -only-testing:StreakSyncTests \
            -only-testing:StreakSyncUITests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO | "$FMT"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
